name: Deploy VaultDrop to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate js/firebase-env.js from GitHub Secrets
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          if [ -n "$FIREBASE_API_KEY" ] && [ -n "$FIREBASE_PROJECT_ID" ]; then
            python3 - <<'PY'
          import json, os
          cfg = {
              "apiKey": os.environ.get("FIREBASE_API_KEY", ""),
              "authDomain": os.environ.get("FIREBASE_AUTH_DOMAIN", ""),
              "projectId": os.environ.get("FIREBASE_PROJECT_ID", ""),
              "storageBucket": os.environ.get("FIREBASE_STORAGE_BUCKET", ""),
              "messagingSenderId": os.environ.get("FIREBASE_MESSAGING_SENDER_ID", ""),
              "appId": os.environ.get("FIREBASE_APP_ID", ""),
          }
          with open("js/firebase-env.js", "w", encoding="utf-8") as f:
              f.write("export const FIREBASE_CONFIG = " + json.dumps(cfg, indent=2) + ";\n")
          print("Generated js/firebase-env.js from repository secrets.")
          PY
          else
            echo "Firebase secrets not set; deploying without firebase-env.js (Sandbox/UI setup mode)."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
